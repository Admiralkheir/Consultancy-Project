# Local test environment: SQL Server + the web app.
#   docker compose up --build   ->  http://localhost:8080  (admin / Admin123!)
services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    # SQL Server occasionally fails its first boot on Docker Desktop/WSL ("Failed to load LSA: 0xc0070102").
    restart: on-failure
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Local_Dev_Passw0rd}"
    ports:
      - "14333:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AppointmentDBContext: "Server=db,1433;Database=AppointmentDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Local_Dev_Passw0rd};TrustServerCertificate=True"
      Seed__AdminUserName: admin
      Seed__AdminPassword: "${ADMIN_PASSWORD:-Admin123!}"
      Seed__SampleData: "true"
    ports:
      - "8080:8080"
    volumes:
      - admin-images:/app/wwwroot/Areas/Admin/Files/Images
      - expert-images:/app/wwwroot/Areas/Ofiice/image

volumes:
  sqldata:
  admin-images:
  expert-images:
